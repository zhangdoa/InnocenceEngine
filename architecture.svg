<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0.5 L0,5.5 L6,3 z" fill="#6b6b8a"/>
    </marker>
  </defs>

  <rect width="1200" height="530" fill="#1e1e2e"/>

  <text x="600" y="26" text-anchor="middle" fill="#cdd6f4"
        font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="600">
    InnocenceEngine — Architecture Overview
  </text>

  <!-- ══ Layer 5 (top): CLIENT PLUGINS ══ -->
  <rect x="50" y="36" width="1100" height="148" rx="4" fill="#1e2b2e" stroke="#89dceb" stroke-width="1"/>
  <rect x="50" y="36" width="5" height="148" rx="2" fill="#89dceb" opacity="0.6"/>
  <text x="68" y="48" fill="#89dceb" font-family="'Segoe UI',Arial,sans-serif"
        font-size="9" letter-spacing="1.5" opacity="0.7">CLIENT PLUGINS</text>

  <!-- ILogicClient — game logic that calls services below, no misleading sub-features -->
  <rect x="65" y="50" width="515" height="126" rx="4" fill="#2a2a3e" stroke="#89dceb" stroke-width="1.5"/>
  <text x="322" y="74" text-anchor="middle" fill="#89dceb"
        font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600">ILogicClient</text>
  <line x1="75" y1="80" x2="570" y2="80" stroke="#89dceb" stroke-width="0.5" opacity="0.25"/>
  <text x="322" y="100" text-anchor="middle" fill="#89dceb" opacity="0.7"
        font-family="'Segoe UI',Arial,sans-serif" font-size="11">User game logic — populates the world via engine services,</text>
  <text x="322" y="118" text-anchor="middle" fill="#89dceb" opacity="0.7"
        font-family="'Segoe UI',Arial,sans-serif" font-size="11">responds to input, drives simulation.</text>
  <text x="322" y="138" text-anchor="middle" fill="#89dceb" opacity="0.55"
        font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic">e.g. DefaultLogicClient</text>

  <!-- IRenderingClient — render pass pipeline IS what this interface contains -->
  <rect x="620" y="50" width="515" height="126" rx="4" fill="#2a2a3e" stroke="#89dceb" stroke-width="1.5"/>
  <text x="877" y="74" text-anchor="middle" fill="#89dceb"
        font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600">IRenderingClient</text>
  <line x1="630" y1="80" x2="1125" y2="80" stroke="#89dceb" stroke-width="0.5" opacity="0.25"/>
  <!-- Render pass pipeline — these are literally what IRenderingClient defines -->
  <text x="720" y="100" fill="#89dceb" opacity="0.8" font-family="'Segoe UI',Arial,sans-serif" font-size="11">GBuffer Pass</text>
  <text x="870" y="100" fill="#89dceb" opacity="0.8" font-family="'Segoe UI',Arial,sans-serif" font-size="11">Light Culling  ·  Light Pass</text>
  <text x="720" y="120" fill="#89dceb" opacity="0.8" font-family="'Segoe UI',Arial,sans-serif" font-size="11">Sky  ·  Transparent Pass</text>
  <text x="870" y="120" fill="#89dceb" opacity="0.8" font-family="'Segoe UI',Arial,sans-serif" font-size="11">TAA  ·  Motion Blur  ·  ACES</text>
  <text x="877" y="140" text-anchor="middle" fill="#89dceb" opacity="0.55"
        font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-style="italic">e.g. DefaultRenderingClient</text>

  <line x1="600" y1="184" x2="600" y2="198" stroke="#6b6b8a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ══ Layer 4: ENGINE ══ -->
  <rect x="50" y="198" width="1100" height="46" rx="4" fill="#2a2a3e" stroke="#cba6f7" stroke-width="2"/>
  <rect x="50" y="198" width="5"    height="46" rx="2" fill="#cba6f7" opacity="0.6"/>
  <text x="600" y="226" text-anchor="middle" fill="#cba6f7"
        font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="700">
    Engine  ·  Service Locator
  </text>

  <line x1="600" y1="244" x2="600" y2="258" stroke="#6b6b8a" stroke-width="1.5" marker-end="url(#arr)"/>

