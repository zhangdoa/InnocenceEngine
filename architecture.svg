  <rect x="50" y="258" width="1100" height="56" rx="4" fill="#1e2b1e" stroke="#a6e3a1" stroke-width="1"/>
  <rect x="50" y="258" width="5"    height="56" rx="2" fill="#a6e3a1" opacity="0.6"/>
  <text x="68" y="270" fill="#a6e3a1" font-family="'Segoe UI',Arial,sans-serif"
        font-size="9" letter-spacing="1.5" opacity="0.7">ENGINE SERVICES</text>

  <!-- EntityRegistry first — ECS core, bolder border -->
  <rect x="65"  y="268" width="162" height="36" rx="4" fill="#2a2a3e" stroke="#a6e3a1" stroke-width="2.5"/>
  <text x="146" y="291" text-anchor="middle" fill="#a6e3a1"
        font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700">EntityRegistry</text>

  <rect x="239" y="268" width="162" height="36" rx="4" fill="#2a2a3e" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="320" y="291" text-anchor="middle" fill="#a6e3a1"
        font-family="'Segoe UI',Arial,sans-serif" font-size="11">CameraService</text>

  <rect x="413" y="268" width="162" height="36" rx="4" fill="#2a2a3e" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="494" y="291" text-anchor="middle" fill="#a6e3a1"
        font-family="'Segoe UI',Arial,sans-serif" font-size="11">DrawCallService</text>

  <rect x="587" y="268" width="162" height="36" rx="4" fill="#2a2a3e" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="668" y="284" text-anchor="middle" fill="#a6e3a1"
        font-family="'Segoe UI',Arial,sans-serif" font-size="10">PerFrameData</text>
  <text x="668" y="298" text-anchor="middle" fill="#a6e3a1"
        font-family="'Segoe UI',Arial,sans-serif" font-size="10">Service</text>

  <rect x="761" y="268" width="162" height="36" rx="4" fill="#2a2a3e" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="842" y="291" text-anchor="middle" fill="#a6e3a1"
        font-family="'Segoe UI',Arial,sans-serif" font-size="11">LightDataService</text>

  <rect x="935" y="268" width="205" height="36" rx="4" fill="#2a2a3e" stroke="#a6e3a1" stroke-width="1.5"/>
  <text x="1037" y="284" text-anchor="middle" fill="#a6e3a1"
        font-family="'Segoe UI',Arial,sans-serif" font-size="10">RenderingConfig</text>
  <text x="1037" y="298" text-anchor="middle" fill="#a6e3a1"
        font-family="'Segoe UI',Arial,sans-serif" font-size="10">Service</text>

  <line x1="600" y1="314" x2="600" y2="328" stroke="#6b6b8a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ══ Layer 2: RENDERING BACKEND ══ -->
  <rect x="50" y="328" width="1100" height="50" rx="4" fill="#2b1e22" stroke="#f38ba8" stroke-width="1.5"/>
  <rect x="50" y="328" width="5"    height="50" rx="2" fill="#f38ba8" opacity="0.6"/>
  <text x="68" y="340" fill="#f38ba8" font-family="'Segoe UI',Arial,sans-serif"
        font-size="9" letter-spacing="1.5" opacity="0.7">RENDERING BACKEND</text>

  <rect x="65" y="338" width="1075" height="32" rx="4" fill="#2a2a3e" stroke="#f38ba8" stroke-width="1.5"/>
  <text x="490" y="359" text-anchor="middle" fill="#f38ba8"
        font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700">IRenderingServer</text>
  <text x="750" y="359" fill="#f38ba8" opacity="0.65"
        font-family="'Segoe UI',Arial,sans-serif" font-size="11">DX12  ·  Vulkan (WIP)  ·  Metal (WIP)</text>

  <line x1="600" y1="378" x2="600" y2="392" stroke="#6b6b8a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ══ Layer 1 (bottom): PLATFORM ══ -->
  <rect x="50" y="392" width="1100" height="56" rx="4" fill="#20253a" stroke="#89b4fa" stroke-width="1"/>
  <rect x="50" y="392" width="5"    height="56" rx="2" fill="#89b4fa" opacity="0.6"/>
  <text x="68" y="404" fill="#89b4fa" font-family="'Segoe UI',Arial,sans-serif"
        font-size="9" letter-spacing="1.5" opacity="0.7">PLATFORM</text>

  <rect x="65"  y="402" width="256" height="36" rx="4" fill="#2a2a3e" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="193" y="425" text-anchor="middle" fill="#89b4fa"
        font-family="'Segoe UI',Arial,sans-serif" font-size="12">WindowService</text>

  <rect x="337" y="402" width="256" height="36" rx="4" fill="#2a2a3e" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="465" y="425" text-anchor="middle" fill="#89b4fa"
        font-family="'Segoe UI',Arial,sans-serif" font-size="12">TaskScheduler</text>

  <rect x="609" y="402" width="256" height="36" rx="4" fill="#2a2a3e" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="737" y="425" text-anchor="middle" fill="#89b4fa"
        font-family="'Segoe UI',Arial,sans-serif" font-size="12">LogService</text>

  <rect x="881" y="402" width="259" height="36" rx="4" fill="#2a2a3e" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="1010" y="425" text-anchor="middle" fill="#89b4fa"
        font-family="'Segoe UI',Arial,sans-serif" font-size="12">FileService</text>

  <!-- ── Legend ── -->
  <rect x="50"  y="470" width="11" height="11" rx="2" fill="#89dceb"/>
  <text x="67"  y="480" fill="#6b6b8a" font-family="'Segoe UI',Arial,sans-serif" font-size="11">Client Plugins</text>

  <rect x="158" y="470" width="11" height="11" rx="2" fill="#cba6f7"/>
  <text x="175" y="480" fill="#6b6b8a" font-family="'Segoe UI',Arial,sans-serif" font-size="11">Engine Core</text>

  <rect x="263" y="470" width="11" height="11" rx="2" fill="#a6e3a1"/>
  <text x="280" y="480" fill="#6b6b8a" font-family="'Segoe UI',Arial,sans-serif" font-size="11">Engine Services</text>

  <rect x="380" y="470" width="11" height="11" rx="2" fill="#f38ba8"/>
  <text x="397" y="480" fill="#6b6b8a" font-family="'Segoe UI',Arial,sans-serif" font-size="11">Rendering Backend</text>

  <rect x="510" y="470" width="11" height="11" rx="2" fill="#89b4fa"/>
  <text x="527" y="480" fill="#6b6b8a" font-family="'Segoe UI',Arial,sans-serif" font-size="11">Platform</text>

  <line x1="592" y1="475" x2="622" y2="475" stroke="#6b6b8a" stroke-width="1.5"/>
  <text x="630" y="480" fill="#6b6b8a" font-family="'Segoe UI',Arial,sans-serif" font-size="11">depends on ↓</text>
</svg>
